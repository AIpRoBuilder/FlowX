          { from: "Review", to: "Publish" }

        missing_dependencies: [],

      var workflows = [

        latest_run: { run_id: "run-20261119-0850", status: "running", updated_at: "2026-11-19T08:52:00+00:00" },
        graph: graph,
        nodes: {
          Intake: { node_id: "n1", version: 1, artifacts: { source: "nodes/n1/00000001/Intake.py", test: "nodes/n1/00000001/tests/test_Intake.py", log: "nodes/n1/00000001/logs/Intake_test.log" } },
          Analyze: { node_id: "n2", version: 2, artifacts: { source: "nodes/n2/00000002/Analyze.py", test: "nodes/n2/00000002/tests/test_Analyze.py", log: "nodes/n2/00000002/logs/Analyze_test.log" } },
          Research: { node_id: "n3", version: 1, artifacts: { source: "nodes/n3/00000001/Research.py", log: "nodes/n3/00000001/logs/Research_test.log" } },
          Draft: { node_id: "n4", version: 1, artifacts: { source: "nodes/n4/00000001/Draft.py", test: "nodes/n4/00000001/tests/test_Draft.py" } },
          Review: { node_id: "n5", version: 1, artifacts: { source: "nodes/n5/00000001/Review.py", log: "nodes/n5/00000001/logs/Review_test.log" } },
          Publish: { node_id: "n6", version: 1, artifacts: { source: "nodes/n6/00000001/Publish.py" } }
        },
        requirement_path: "plan/requirement_analysis.md",
        graph_path: "plan/workflow.json",
        log_path: "logs/main_run.log"
      };
      var runs = {
        latestRunId: "run-20261119-0850",
        runs: [
          { run_id: "run-20261119-0850", workflow_version: 4, status: "running", created_at: "2026-11-19T08:50:00+00:00", updated_at: "2026-11-19T08:52:00+00:00", node_count: 6, has_error: false },
          { run_id: "run-20261118-2108", workflow_version: 3, status: "completed", created_at: "2026-11-18T21:08:00+00:00", updated_at: "2026-11-18T21:10:00+00:00", node_count: 6, has_error: false },
          { run_id: "run-20261117-1600", workflow_version: 2, status: "failed", created_at: "2026-11-17T16:00:00+00:00", updated_at: "2026-11-17T16:03:00+00:00", node_count: 6, has_error: true }
        ]
      };
      var run = {
        run_id: "run-20261119-0850",
        workflow_version: 4,
        status: "running",
        created_at: "2026-11-19T08:50:00+00:00",
        updated_at: "2026-11-19T08:52:00+00:00",
        awaiting: null,
        has_error: false,
        nodes: {
          Intake: { status: "completed", title: "Intake", card: { kind: "prompt", prompt: "Request: produce a market brief on autonomous workflow agents for a product strategy review." }, is_final: false, updated_at: "2026-11-19T08:50:10+00:00" },

          Research: { status: "running", title: "Research", card: { kind: "prompt", prompt: "Gathering sources from vendor documentation, analyst notes, and public case studies." }, is_final: false, updated_at: "2026-11-19T08:52:00+00:00" },
          Draft: { status: "completed", title: "Draft", card: { kind: "prompt", prompt: "Draft outline: market context, adoption drivers, vendor landscape, risks, recommendations." }, is_final: false, updated_at: "2026-11-19T08:51:40+00:00" },
          Review: { status: "pending", title: "Review", card: {}, is_final: false, updated_at: null },
          Publish: { status: "pending", title: "Publish", card: {}, is_final: false, updated_at: null }
        }
      };
      var files = {
        path: "",
        truncated: false,
        entries: [
          { name: "plan", path: "plan", kind: "dir", size: null, readable: true },
          { name: "nodes", path: "nodes", kind: "dir", size: null, readable: true },
          { name: "runs", path: "runs", kind: "dir", size: null, readable: true },
          { name: "service", path: "service", kind: "dir", size: null, readable: true },
          { name: "agent.json", path: "agent.json", kind: "text", mime: "text/plain", size: 482, readable: true },
          { name: "manifest.json", path: "manifest.json", kind: "text", mime: "text/plain", size: 3910, readable: true },
          { name: "canvas_layout.json", path: "canvas_layout.json", kind: "text", mime: "text/plain", size: 190, readable: true }
        ]
      };
      var requirement = "# Market brief\n\nProduce a concise market brief on autonomous workflow agents for a product strategy review.\n\n## Audience\nProduct leadership and go-to-market.\n\n## Success criteria\n- Claims are sourced.\n- Recommendations are explicit.\n- Open questions are listed.\n";

      function mockFetch(path) {
        var clean = String(path || "").replace("/api/plugins/flowx", "");
        if (clean === "/workflows") {
          return Promise.resolve({ ok: true, workspace: "/Users/demo/flowx_workspaces", workspace_exists: true, workflows: workflows });
        }
        if (clean === "/workflows/market_brief") {
          return Promise.resolve({ ok: true, workflow: detail });
        }
        if (clean === "/workflows/market_brief/runs") {
          return Promise.resolve(Object.assign({ ok: true }, runs));
        }
        if (clean === "/workflows/market_brief/runs/run-20261119-0850") {
          return Promise.resolve({ ok: true, run: run });
        }
        if (clean === "/workflows/market_brief/layout") {
          return Promise.resolve({ ok: true, positions: {} });
        }
        if (clean.indexOf("/workflows/market_brief/files") === 0) {
          return Promise.resolve(Object.assign({ ok: true }, files));
        }
        if (clean.indexOf("/workflows/market_brief/file") === 0) {
          return Promise.resolve({ ok: true, path: "plan/workflow.json", content: JSON.stringify(graph, null, 2), bytes: 2048 });
        }
        if (clean === "/workflows/market_brief/requirement") {
          return Promise.resolve({ ok: true, path: "plan/requirement_analysis.md", content: requirement, bytes: requirement.length });
        }
        return Promise.reject(new Error("Mock route not found: " + clean));
      }

      window.__HERMES_PLUGIN_SDK__ = {
        React: React,
        hooks: {
          useState: React.useState,
          useEffect: React.useEffect,
          useMemo: React.useMemo,
          useRef: React.useRef,
          useCallback: React.useCallback,
        },
        fetchJSON: mockFetch,
        authedFetch: function (path) { return mockFetch(path); },
      };
      window.__HERMES_PLUGINS__ = {
        register: function (name, Component) {
          window.__FLOWX_DEMO_COMPONENT__ = Component;
        },
      };
    })();
  </script>
  <script src="../dashboard/dist/index.js"></script>
  <script>
    (function () {
      "use strict";
      var React = window.React;
      var ReactDOM = window.ReactDOM;
      var Component = window.__FLOWX_DEMO_COMPONENT__;
      if (!Component) {
        document.getElementById("root").textContent = "FlowX bundle did not register a component.";
        return;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Component));
    })();
  </script>
