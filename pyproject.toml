[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowx-mcp"
version = "0.1.0"
description = "MCP server that wraps meta_agent + ag_ui_workflow for AG-UI workflow build/host/run"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "meta-agent",
    "ag-ui-workflow",
]

[project.optional-dependencies]
dev = ["python-dotenv"]

[project.scripts]
flowx-mcp = "flowx_mcp.server:main"

[tool.setuptools.packages.find]
include = ["flowx_mcp*"]
