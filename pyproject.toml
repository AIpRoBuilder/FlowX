[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowx"
version = "0.2.0"
description = "Agent workflow compiler with MCP, SDK, and A2A interfaces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "ag-ui-workflow @ git+https://github.com/AIpRoBuilder/ag_ui_worflow.git",
    "fastapi>=0.110",
    "mcp>=1.2.0",
    "openai>=1.0",
    "python-dotenv",
    "uvicorn>=0.30",
]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.scripts]
flowx-mcp = "flowx_mcp.server:main"
flowx-a2a = "flowx_a2a.server:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["packages/core", "packages/mcp", "packages/sdk", "packages/a2a"]
include = ["flowx_core*", "flowx_mcp*", "flowx_sdk*", "flowx_a2a*"]
namespaces = true

[tool.setuptools.package-data]
"flowx_core" = ["**/*.md", "**/*.tmpl"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/mcp", "packages/sdk", "packages/a2a"]
